<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CycleDash Pro - Neon Precision</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
        body, html { margin: 0; padding: 0; height: 100svh; width: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, system-ui, sans-serif; }
        #container { display: flex; flex-direction: column; height: 100svh; width: 100vw; }
        
        #hud-header { background: #222; color: white; padding-top: var(--sat); display: grid; grid-template-columns: 1fr 1.1fr 1fr; border-bottom: 1px solid #444; flex-shrink: 0; z-index: 1000; height: 60px; }
        .hud-column { display: flex; flex-direction: column; padding: 0px 10px; justify-content: center; }
        .data-row { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #333; }
        
        .label { font-size: 9px; font-weight: bold; color: #888; text-transform: uppercase; }
        .val-text { font-size: 17px; font-weight: bold; font-family: monospace; color: #fff; line-height: 1.2; }

        #map-window { flex: 1; position: relative; overflow: hidden; background: #111; z-index: 1; }
        #map { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; transform-origin: center center; transition: transform 0.4s linear; }

        #accuracy-box { 
            position: absolute; bottom: 10px; left: 10px; z-index: 5000;
            background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; font-family: monospace;
            padding: 3px 6px; border-radius: 4px; pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
        }

        #compass-ui { 
            position: absolute; top: 15px; left: 15px; z-index: 5000; 
            width: 40px; height: 40px; background: rgba(0,0,0,0.8); 
            border-radius: 50%; border: 2px solid #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #needle-pivot { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.3s ease; z-index: 1; }
        
        #arrowhead { 
            position: absolute; top: 0px; left: 50%; transform: translateX(-50%);
            width: 12px; height: 20px; background: #e74c3c;
            clip-path: polygon(50% 0%, 0% 100%, 50% 80%, 100% 100%);
        }

        #mode-sub-label { 
            position: absolute; z-index: 10;
            font-size: 9px; color: #fff; font-weight: bold; 
            text-transform: uppercase; pointer-events: none; 
            letter-spacing: normal; width: 100%; text-align: center;
            text-shadow: 0px 0px 4px rgba(0,0,0,1);
            line-height: 40px; 
        }

        #bottom-tray { display: flex; height: 140px; background: #fff; border-top: 2px solid #333; padding-bottom: var(--sab); flex-shrink: 0; z-index: 1000; }
        #chart-section { flex: 1; min-width: 0; padding: 2px; background: #f9f9f9; display: flex; flex-direction: column; overflow: hidden; }
        #action-section { flex: 0 0 90px; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; background: #ececec; border-left: 1px solid #ccc; }
        
        .action-btn { font-size: 9px; cursor: pointer; text-align: center; width: 80px; padding: 8px 0; background: #fff; border: 1px solid #999; border-radius: 4px; font-weight: bold; }
        #recenter-btn { position: absolute; top: 15px; right: 15px; z-index: 5000; background: #3498db; color: white; border: 2px solid #fff; display: none; padding: 10px 15px; font-size: 11px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div id="container">
    <div id="hud-header">
        <div class="hud-column">
            <div class="data-row"><span class="label">MPH</span><span class="val-text" id="speed-val">---</span></div>
            <div class="data-row"><span class="label">REM</span><span class="val-text" id="remain-val">---</span></div>
        </div>
        <div class="hud-column">
            <div class="data-row"><span class="label" id="status-label">TIME</span><span class="val-text" id="time-val">--:--</span></div>
            <div class="data-row"><span class="label">HDG</span><span class="val-text" id="heading-val">---</span></div>
        </div>
        <div class="hud-column">
            <div class="data-row"><span class="label">ELV</span><span class="val-text" id="elev-val">---</span></div>
            <div class="data-row"><span class="label">GRD</span><span class="val-text" id="grade-val">---</span></div>
        </div>
    </div>

    <div id="map-window">
        <div id="map"></div>
        <div id="accuracy-box">GPS: -- ft</div>
        <div id="compass-ui">
            <div id="needle-pivot"><div id="arrowhead"></div></div>
            <div id="mode-sub-label">NORTH</div>
        </div>
        <button id="recenter-btn">RECENTER</button>
    </div>

    <div id="bottom-tray">
        <div id="chart-section">
            <canvas id="elevationChart"></canvas>
        </div>
        <div id="action-section">
            <label class="action-btn">LOAD <input type="file" id="route-upload" accept=".kml,.kmz" style="display:none"></label>
            <button class="action-btn" id="rev-btn">REVERSE</button>
            <button class="action-btn" id="fs-btn">FULL</button>
            <button class="action-btn" id="reset-btn">RESET</button>
        </div>
    </div>
</div>

<script>
    let map, chart, userMarker, snappedMarker, breadcrumbLayer, routeLayer, startMarker, endMarker;
    let masterCoords = [], routeGeoJson = null, kmlRouteLine = null;
    let crumbs = [], routeElevData = [], segmentColors = [];
    let isFollowing = true, isRouteUp = false; 
    let lastValidLat = 0, lastValidLng = 0, targetHeading = 0, totalDist = 0, currentRouteDist = 0;
    let lastGpsTick = 0, flashPhase = false;
    
    const METERS_TO_FEET = 3.28084, MPS_TO_MPH = 2.23694;
    const FIVE_MINUTES = 300000;
    const fmt = (val, dec = 0) => (val === null || isNaN(val) || val === undefined) ? "---" : Number(val).toFixed(dec);

    function updateTimeAndHeartbeat() {
        const now = new Date();
        let h = now.getHours() % 12 || 12, m = now.getMinutes().toString().padStart(2, '0'), x = now.getHours() >= 12 ? 'p' : 'a';
        document.getElementById('time-val').innerText = `${h}:${m}${x}`;
        const statusEl = document.getElementById('status-label');
        const isStale = (Date.now() - lastGpsTick > 2500);
        flashPhase = !flashPhase; 
        statusEl.style.color = isStale ? (flashPhase ? "#e74c3c" : "#555") : (flashPhase ? "#2ecc71" : "#555");
    }

    function renderLoop() {
        if (lastValidLat !== 0) {
            userMarker.setLatLng([lastValidLat, lastValidLng]);
            document.getElementById('map').style.transform = `rotate(${isRouteUp ? -targetHeading : 0}deg)`;
            document.getElementById('needle-pivot').style.transform = `rotate(${isRouteUp ? 0 : targetHeading}deg)`;
            document.getElementById('mode-sub-label').innerText = isRouteUp ? "ROUTE" : "NORTH";
            if (isFollowing) map.setView([lastValidLat, lastValidLng], map.getZoom(), { animate: false });
        }
        requestAnimationFrame(renderLoop);
    }

    function handleGPSUpdate(pos) {
        const now = Date.now();
        lastGpsTick = now;
        const { latitude, longitude, speed, altitude, accuracy } = pos.coords;
        lastValidLat = latitude; lastValidLng = longitude;
        document.getElementById('accuracy-box').innerText = `GPS: ±${Math.round(accuracy * METERS_TO_FEET)}ft`;
        
        crumbs.push({ latlng: [latitude, longitude], time: now });
        crumbs = crumbs.filter(c => now - c.time < FIVE_MINUTES);
        breadcrumbLayer.clearLayers();
        crumbs.forEach(c => {
            L.circleMarker(c.latlng, { radius: 3, color: '#00FFFF', fillOpacity: 0.8, stroke: false, zIndexOffset: 4000 }).addTo(breadcrumbLayer);
        });

        if (accuracy > 50) return;
        document.getElementById('speed-val').innerText = fmt(speed * MPS_TO_MPH, 1);
        document.getElementById('elev-val').innerText = fmt(altitude * METERS_TO_FEET, 0);
        updateRouteContext(latitude, longitude);
    }

    function init() {
        setInterval(updateTimeAndHeartbeat, 500);
        map = L.map('map', { zoomControl: false, preferCanvas: true, attributionControl: false }).setView([0,0], 17);
        L.tileLayer('https://{s}.tile.osm.org/{z}/{x}/{y}.png').addTo(map);
        routeLayer = L.layerGroup().addTo(map);
        breadcrumbLayer = L.layerGroup().addTo(map);
        
        userMarker = L.circleMarker([0,0], { stroke: true, color: '#fff', weight: 2, fillOpacity: 1, fillColor: '#00FFFF', radius: 8, zIndexOffset: 4000 }).addTo(map);
        snappedMarker = L.circleMarker([0,0], { stroke: true, color: '#000', weight: 1, fillOpacity: 1, fillColor: '#FF9F00', radius: 6, zIndexOffset: 3000 }).addTo(map);
        
        startMarker = L.circleMarker([0,0], { color: '#2ecc71', fillOpacity: 0.9, radius: 8, zIndexOffset: 2500 });
        endMarker = L.circleMarker([0,0], { color: '#e74c3c', fillOpacity: 0.9, radius: 8, zIndexOffset: 2500 });

        const ctx = document.getElementById('elevationChart').getContext('2d');
        const verticalLinePlugin = {
            id: 'verticalLine',
            afterDatasetsDraw(chart) {
                if (currentRouteDist === 0) return;
                const {ctx, chartArea: {top, bottom}, scales: {x}} = chart;
                const xPos = x.getPixelForValue(currentRouteDist);
                if (xPos >= chart.chartArea.left && xPos <= chart.chartArea.right) {
                    ctx.save(); ctx.beginPath(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                    ctx.moveTo(xPos, top); ctx.lineTo(xPos, bottom); ctx.stroke(); ctx.restore();
                }
            }
        };

        chart = new Chart(ctx, {
            type: 'line', plugins: [verticalLinePlugin],
            data: { datasets: [{ id:'route', data:[], stepped: 'middle', fill: true, pointRadius: 0, borderWidth: 1,
                segment: { borderColor: c => getGradeColor(c.p0DataIndex), backgroundColor: c => getGradeColor(c.p0DataIndex, 0.4) }
            }]},
            options: { 
                responsive:true, maintainAspectRatio:false, layout: { padding: 0 },
                plugins:{ legend:false, tooltip: false }, animation:false, 
                scales:{ 
                    x:{ type:'linear', display: true, ticks: { font: { size: 9 } }, grid: { color: 'rgba(0, 0, 0, 0.1)' } }, 
                    y:{ grace:'15%', beginAtZero: false, ticks: { font: { size: 9 } }, grid: { color: 'rgba(0, 0, 0, 0.1)' } } 
                }
            }
        });

        setupListeners();
        const savedKml = localStorage.getItem('cycling_route_foss_kml');
        if (savedKml) parseAndProcessKml(savedKml);
        requestAnimationFrame(renderLoop);
        if ("geolocation" in navigator) navigator.geolocation.watchPosition(handleGPSUpdate, null, { enableHighAccuracy: true });
    }

    function getGradeColor(idx, alpha = 1) {
        const color = segmentColors[idx] || '#27ae60';
        if (alpha === 1) return color;
        const r = parseInt(color.slice(1,3), 16), g = parseInt(color.slice(3,5), 16), b = parseInt(color.slice(5,7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }

    async function handleFileSelect(file) {
        if (!file) return;
        const reader = new FileReader();
        if (file.name.toLowerCase().endsWith('.kmz')) {
            reader.onload = async (e) => {
                const zip = await JSZip.loadAsync(e.target.result);
                const kmlFile = zip.file("doc.kml") || zip.file(/\.kml$/i)[0];
                if (kmlFile) parseAndProcessKml(await kmlFile.async("string"));
            };
            reader.readAsArrayBuffer(file);
        } else {
            reader.onload = (e) => parseAndProcessKml(e.target.result);
            reader.readAsText(file);
        }
    }

    function parseAndProcessKml(xml) {
        try {
            const dom = new DOMParser().parseFromString(xml, "text/xml");
            const geojson = toGeoJSON.kml(dom);
            let coords = [];
            geojson.features.forEach(f => {
                if (f.geometry.type === 'LineString') coords = coords.concat(f.geometry.coordinates);
                else if (f.geometry.type === 'MultiLineString') f.geometry.coordinates.forEach(l => coords = coords.concat(l));
            });
            if (coords.length > 0) { 
                masterCoords = coords; 
                processRoutePoints(coords); 
                localStorage.setItem('cycling_route_foss_kml', xml); 
            }
        } catch(e) { console.error(e); }
    }

    function processRoutePoints(src) {
        routeElevData = []; segmentColors = []; totalDist = 0;
        const processed = src.map(c => [c[0], c[1], (c[2] || 0) * METERS_TO_FEET]);
        routeGeoJson = { type: "Feature", geometry: { type: "LineString", coordinates: processed } };
        let d = 0;
        for(let i=0; i < processed.length - 1; i++) {
            const step = turf.distance(turf.point(processed[i]), turf.point(processed[i+1]), {units:'miles'});
            const rise = processed[i+1][2] - processed[i][2];
            const grade = (step > 0) ? (rise / (step * 5280)) * 100 : 0;
            routeElevData.push({ x: d, y: (processed[i][2] + processed[i+1][2]) / 2 });
            segmentColors.push(grade > 6 ? '#e74c3c' : (grade > 3 ? '#f1c40f' : (grade < -3 ? '#3498db' : '#27ae60')));
            d += step;
        }
        routeElevData.push({ x: d, y: processed[processed.length-1][2] });
        totalDist = d;
        chart.data.datasets[0].data = routeElevData;
        chart.update();
        
        routeLayer.clearLayers();
        // Dashed Black Route Line
        kmlRouteLine = L.polyline(processed.map(c => [c[1], c[0]]), { color: '#000', weight: 3, opacity: 1, dashArray: '5, 10' }).addTo(routeLayer);
        
        startMarker.setLatLng([processed[0][1], processed[0][0]]).addTo(routeLayer);
        endMarker.setLatLng([processed[processed.length-1][1], processed[processed.length-1][0]]).addTo(routeLayer);
    }

    function updateRouteContext(lat, lng) {
        if (!routeGeoJson) return;
        const userPt = turf.point([lng, lat]);
        const snapped = turf.nearestPointOnLine(routeGeoJson, userPt, {units: 'miles'});
        currentRouteDist = snapped.properties.location;
        snappedMarker.setLatLng([snapped.geometry.coordinates[1], snapped.geometry.coordinates[0]]);
        targetHeading = turf.bearing(turf.along(routeGeoJson, currentRouteDist, {units:'miles'}), turf.along(routeGeoJson, currentRouteDist + 0.04, {units:'miles'}));
        const e1 = getElevAtDist(currentRouteDist), e2 = getElevAtDist(currentRouteDist + 0.01);
        document.getElementById('heading-val').innerText = fmt((targetHeading + 360) % 360, 0) + "°";
        document.getElementById('grade-val').innerText = fmt(((e2 - e1) / (0.01 * 5280)) * 100, 1);
        document.getElementById('remain-val').innerText = fmt(Math.max(0, totalDist - currentRouteDist), 1);
        chart.options.scales.x.min = currentRouteDist - 0.2;
        chart.options.scales.x.max = currentRouteDist + 0.8;
        chart.update('none'); 
    }

    function getElevAtDist(t) {
        const target = Math.max(0, Math.min(t, totalDist)), coords = routeGeoJson.geometry.coordinates;
        let d = 0;
        for (let i = 0; i < coords.length - 1; i++) {
            const step = turf.distance(turf.point(coords[i]), turf.point(coords[i+1]), {units:'miles'});
            if (target >= d && target <= d + step) return coords[i][2] + ((target - d) / step) * (coords[i+1][2] - coords[i][2]);
            d += step;
        }
        return coords[coords.length - 1][2];
    }

    function setupListeners() {
        document.getElementById('route-upload').onchange = (e) => handleFileSelect(e.target.files[0]);
        document.getElementById('rev-btn').onclick = () => { if(masterCoords.length) { masterCoords.reverse(); processRoutePoints(masterCoords); } };
        document.getElementById('reset-btn').onclick = () => { localStorage.clear(); location.reload(); };
        document.getElementById('recenter-btn').onclick = () => { isFollowing = true; document.getElementById('recenter-btn').style.display = 'none'; };
        document.getElementById('compass-ui').onclick = () => { isRouteUp = !isRouteUp; };
        map.on('dragstart', () => { isFollowing = false; document.getElementById('recenter-btn').style.display = 'block'; });
        document.getElementById('fs-btn').onclick = () => { (!document.fullscreenElement) ? document.documentElement.requestFullscreen() : document.exitFullscreen(); };
    }
    window.onload = init;
</script>
</body>
</html>
